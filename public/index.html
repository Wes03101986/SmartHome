<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zuhause</title>
<style>
:root{--bg:#eef0ee;--card:#fff;--ink:#1d2623;--mute:#6b7773;--line:#d9dedb;--on:#e8a31c;--onink:#2b1d00;--ok:#2f7d5b;--bad:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--card:#1e2522;--ink:#e8ede9;--mute:#8a9692;--line:#2f3935;--on:#f0b43a;--onink:#2b1d00;--ok:#5fc095;--bad:#e5806f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next",Avenir,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;padding:20px 24px 4px;flex-wrap:wrap;gap:8px}
h1{font-size:1.6rem;margin:0;font-weight:600;letter-spacing:-.01em}
.stat{font-size:.85rem;color:var(--mute)}.stat b{font-weight:500}.stat i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 12px;background:var(--bad)}.stat i.ok{background:var(--ok)}
main{padding:8px 24px 40px;max-width:1100px;margin:auto}
h2{font-size:1.05rem;font-weight:600;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.t{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:background .2s}
.t.on{background:var(--on);color:var(--onink);border-color:var(--on)}.t.off{opacity:.55}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:600}.sub{font-size:.8rem;opacity:.75}
button.sw{all:unset;cursor:pointer;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none}
button.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.on button.sw{background:var(--onink)}.on button.sw::after{transform:translateX(20px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input[type=range]{width:100%;accent-color:currentColor}
.colors{display:flex;gap:6px}.colors button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.2)}
nav{display:flex;gap:6px;padding:8px 24px 0;max-width:1100px;margin:auto;flex-wrap:wrap}
nav button{all:unset;cursor:pointer;padding:6px 14px;border-radius:16px;border:1px solid var(--line);font-size:.9rem}
nav button.a{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btns{display:flex;gap:6px}.btns button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;cursor:pointer;touch-action:none;user-select:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);opacity:.6}
.big{font-size:1.8rem;font-weight:600}
svg{width:100%;height:auto;display:block}
.rm{fill:var(--card);stroke:var(--ink);stroke-width:3;cursor:pointer;transition:fill .3s}.rm.sel{stroke:var(--on);stroke-width:8}.rm.gar{fill:none;stroke-dasharray:12 8}
.lb{font-size:27px;font-weight:600;text-anchor:middle;fill:var(--ink);pointer-events:none}.sb{font-size:21px;text-anchor:middle;fill:var(--mute);pointer-events:none}
.bl{fill:var(--line);pointer-events:none}.bf{fill:var(--ink);opacity:.55;pointer-events:none}
svg .idle{fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;opacity:.55}
svg .flow{fill:none;stroke:#55bd35;stroke-width:6;stroke-linecap:round;stroke-dasharray:1 17;animation:fl 1.1s linear infinite}
svg .chev{fill:none;stroke:var(--mute);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
svg .ico{fill:var(--card);stroke:#55bd35;stroke-width:5}svg .ig{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg .ev{font-size:19px;font-weight:600;text-anchor:middle;fill:var(--ink)}svg .el{font-size:17px;text-anchor:middle;fill:var(--mute)}
@keyframes fl{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){svg .flow{animation:none;stroke-dasharray:none;opacity:.6}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>Zuhause</h1>
<div class="stat"><i id="k"></i><b>KNX</b><i id="h"></i><b>Hue</b><i id="s"></i><b>Solar</b></div></header>
<nav id="tabs"></nav>
<main id="app"><p class="stat">Verbinde mit Server …</p></main>
<script>
const $=s=>document.querySelector(s), post=(u,b)=>fetch(u,{method:'POST',body:JSON.stringify(b)});
const PRESETS=[['Warmweiß',{ct:400,on:true}],['Neutral',{ct:300,on:true}],['Kaltweiß',{ct:200,on:true}],['Rot',{hue:0,sat:254,on:true}],['Grün',{hue:25500,sat:254,on:true}],['Blau',{hue:46920,sat:254,on:true}]];
const COL=['#ffb347','#ffe9c8','#d6e8ff','#e03c31','#3fae5a','#3a6fe0'];
let busy=0,last=null,tab='Grundriss',held=null,floor='EG',sel=null;
const S=100,PLAN={
 EG:{Esszimmer:[[0,0,4.42,3.5]],Wohnzimmer:[[0,3.5,4.42,4.74]],Küche:[[4.42,0,4.2,3.65]],Speisekammer:[[8.62,0,1.1,2.1]],Gästezimmer:[[10.5,0,3.14,3.2]],
  Treppe:[[4.42,5.1,1.58,3.14]],Diele:[[6,3.65,3,4.59],[4.42,3.65,1.58,1.45],[8.62,2.1,1.88,1.1],[8.62,3.2,5.02,1.95],[9,5.15,1.5,.95]],WC:[[9,6.1,1.5,2.14]],HWR:[[10.5,5.15,3.14,3.09]],Garage:[[14,3,2.6,5.2]]},
 OG:{Eliza:[[0,0,4.42,3.64]],Büro:[[0,4.54,4.42,3.7]],Felix:[[4.42,0,2.9,3.7]],Bad:[[8.9,0,4.74,2.9]],Galerie:[[4.42,3.7,7.4,1.2],[0,3.64,4.42,.9],[6,4.9,1,3.34]],
  Treppe:[[4.42,4.9,1.58,3.34]],Schlafzimmer:[[7,4.9,6.64,3.34]]}};
function planView(d){
  const btn=f=>`<button class="${f===floor?'a':''}" onclick="floor='${f}';sel=null;render(last)">${f==='EG'?'Erdgeschoss':'Obergeschoss'}</button>`;
  let v=`<nav style="padding:12px 0 8px;margin:0">${btn('EG')}${btn('OG')}</nav><div style="overflow-x:auto"><div style="min-width:760px"><svg viewBox="-20 -20 1740 864" role="img" aria-label="Grundriss ${floor}">`;
  for(const [name,rects] of Object.entries(PLAN[floor])){
    const devs=d.knx.filter(x=>x.room===name),lights=devs.filter(x=>x.type==='dimmer'||x.type==='switch'),
      blinds=devs.filter(x=>x.type==='blind'||x.type==='gate'),heat=devs.find(x=>x.type==='heating'),
      hl=d.hue.filter(x=>x.room===name&&x.reachable),lit=lights.some(x=>x.on)||hl.some(x=>x.on),lvl=Math.max(0,...lights.map(x=>x.level??100),...hl.filter(x=>x.on).map(x=>x.bri/2.54));
    rects.forEach(([x,y,w,h])=>v+=`<rect x="${x*S}" y="${y*S}" width="${w*S}" height="${h*S}" class="rm ${sel===name?'sel':''} ${name==='Garage'?'gar':''}" style="${lit?`fill:var(--on);fill-opacity:${(.3+lvl/150).toFixed(2)}`:''}" onclick="sel='${name}';render(last)"/>`);
    const [x,y,w,h]=rects[0];
    v+=`<text x="${(x+w/2)*S}" y="${(y+h/2)*S}" class="lb">${name}</text>`;
    hl.forEach((q,k)=>v+=`<circle cx="${x*S+24+k*26}" cy="${y*S+24}" r="9" style="fill:${q.on?'var(--on)':'var(--line)'};stroke:var(--ink);stroke-width:2"><title>${q.name}</title></circle>`);
    if(heat)v+=`<text x="${(x+w/2)*S}" y="${(y+h/2)*S+28}" class="sb">${f1(heat.temp)} °C</text>`;
    blinds.forEach((b,i)=>{const bw=w*S-30,by=(y+h)*S-16-i*11;
      v+=`<rect class="bl" x="${x*S+15}" y="${by}" width="${bw}" height="7" rx="3"/><rect class="bf" x="${x*S+15}" y="${by}" width="${bw*(b.pos??0)/100}" height="7" rx="3"/>`});
  }
  v+='</svg></div></div><p class="stat">Gelb = Licht an, Punkte = Hue-Leuchten, Balken = Rollladen (voll = geschlossen). Raum antippen für die Bedienung.</p>';
  const known=new Set([...Object.keys(PLAN.EG),...Object.keys(PLAN.OG)]),loose=d.hue.filter(x=>!known.has(x.room));
  if(loose.length)v+=`<h2>Hue ohne Raumzuordnung</h2><div class="grid">${loose.map(hueTile).join('')}</div>`;
  if(sel){const l=d.knx.filter(x=>x.room===sel),hh=d.hue.filter(x=>x.room===sel);v+=`<h2>${sel}</h2>`+(l.length||hh.length?`<div class="grid">${l.map(tile).join('')}${hh.map(hueTile).join('')}</div>`:'<p class="stat">Hier sind keine Geräte hinterlegt.</p>')}
  return v;
}
const cmd=(id,c,v)=>post('/api/knx',{id,cmd:c,value:v});
const hold=(id,dir)=>{held=id;busy=Infinity;cmd(id,'dim',dir)};
document.addEventListener('pointerup',()=>{if(held){cmd(held,'dim','stop');held=null;busy=Date.now()+800;setTimeout(()=>last&&render(last),900)}});
const gate=(id,c)=>confirm('Garagentor wirklich '+(c==='open'?'öffnen':'schließen')+'?')&&cmd(id,'move',c);
const f1=v=>v==null?'–':(+v).toFixed(1).replace('.',',');
const kw=w=>Math.abs(w)>=1000?(Math.abs(w)/1000).toFixed(2).replace('.',',')+' kW':Math.round(Math.abs(w))+' W';
function energyView(d){
  const q=d.solar;
  if(!q)return '<p class="stat" style="margin-top:20px">Keine Verbindung zur Solaranlage. Prüfe die Meldung im Terminal (RSCP-Zugangsdaten bzw. Modbus) und die IP.</p>';
  const on=w=>Math.abs(w)>10,W=w=>Math.round(Math.abs(w)).toLocaleString('de-DE')+' W',pc=v=>(+v||0).toFixed(2).replace('.',',');
  const unit=(a,b)=>{const l=Math.hypot(b[0]-a[0],b[1]-a[1]);return[(b[0]-a[0])/l,(b[1]-a[1])/l]};
  const rp=(a,b,c,r=14)=>{const i=unit(a,b),o=unit(b,c);return `M${a} L${b[0]-i[0]*r},${b[1]-i[1]*r} Q${b} ${b[0]+o[0]*r},${b[1]+o[1]*r} L${c}`};
  const chev=(b,c)=>{const u=unit(b,c);return `<polyline class="chev" points="${c[0]-13*u[0]-7*u[1]},${c[1]-13*u[1]+7*u[0]} ${c} ${c[0]-13*u[0]+7*u[1]},${c[1]-13*u[1]-7*u[0]}"/>`};
  const conn=(p,act)=>`<path class="idle" d="${rp(...p)}"/>${act?`<path class="flow" d="${rp(...p)}"/>`:''}${chev(p[1],p[2])}`;
  const ico=(cx,y,g)=>`<rect class="ico" x="${cx-30}" y="${y}" width="60" height="60" rx="12"/><g class="ig" transform="translate(${cx},${y+30})">${g}</g>`;
  const rays=[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${(11*Math.cos(r)).toFixed(1)}" y1="${(11*Math.sin(r)).toFixed(1)}" x2="${(17*Math.cos(r)).toFixed(1)}" y2="${(17*Math.sin(r)).toFixed(1)}"/>`}).join('');
  const G={pv:`<circle r="6.5"/>${rays}`,
    grid:'<path d="M0-19L-9 19M0-19L9 19M-6 0H6M-8 10H8M-14-9H14M-10-9L0-19L10-9"/>',
    batt:`<rect x="-19" y="-10" width="35" height="20" rx="4"/><path d="M19-4V4"/><text x="-1" y="4.5" style="font-size:9px;fill:var(--ink);stroke:none;text-anchor:middle">${pc(q.soc)}%</text>`,
    house:'<path d="M-17-1L0-17L17-1M-12-5V16H12V-5M-4 16V7H4V16"/>'};
  const C=2*Math.PI*62,aut=Math.max(0,Math.min(100,q.autarky));
  const gridIn=q.grid>10,battOut=q.batt<-10,battIn=q.batt>10;
  const lines=conn([[130,150],[130,215],[215,215]],on(q.pv))
    +conn(gridIn||!on(q.grid)?[[430,150],[430,215],[345,215]]:[[345,215],[430,215],[430,150]],on(q.grid))
    +conn(battIn?[[215,305],[130,305],[130,382]]:[[130,382],[130,305],[215,305]],on(q.batt))
    +conn([[345,305],[430,305],[430,382]],on(q.house));
  const node=(cx,top,g,v,l)=>top?`<text class="el" x="${cx}" y="38">${l}</text>${ico(cx,50,g)}<text class="ev" x="${cx}" y="134">${v}</text>`
    :`<text class="ev" x="${cx}" y="404">${v}</text>${ico(cx,418,g)}<text class="el" x="${cx}" y="506">${l}</text>`;
  const bs=battIn?'lädt':battOut?'entlädt':'Standby',gs=gridIn?'Bezug':q.grid<-10?'Einspeisung':'ausgeglichen';
  const when=new Date(q.ts).toLocaleString('de-DE');
  return `<div class="t" style="max-width:680px;margin:16px auto 0"><div><div class="name">Aktuelle Werte</div><div class="sub">${when}</div></div>
    <svg viewBox="0 0 560 520" role="img" aria-label="Energiefluss: PV ${W(q.pv)}, Netz ${W(q.grid)} (${gs}), Batterie ${pc(q.soc)} % (${bs}), Haus ${W(q.house)}, Autarkie ${pc(aut)} %">${lines}
    <circle cx="280" cy="260" r="62" fill="none" stroke="#1b94a8" stroke-width="12"/>
    <circle cx="280" cy="260" r="62" fill="none" stroke="#0b8a66" stroke-width="12" stroke-linecap="butt" stroke-dasharray="${(C*aut/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 280 260)"/>
    <text x="280" y="268" class="ev" style="font-size:22px">${pc(aut)}<tspan style="font-size:14px"> %</tspan></text><text x="280" y="288" class="el" style="font-size:12px">Autarkie</text>
    ${node(130,1,G.pv,W(q.pv),'PV')}${node(430,1,G.grid,W(q.grid),'Netz')}${node(130,0,G.batt,W(q.batt),'Batterie')}${node(430,0,G.house,W(q.house),'Haus')}</svg>
    <div class="sub">Batterie ${bs} · Netz: ${gs} · Eigenverbrauch ${pc(q.selfUse)} %${q.wallbox>10?' · Wallbox '+W(q.wallbox):''}</div></div>`;
}
const hueTile=x=>`
    <div class="t ${x.on?'on':''} ${x.reachable?'':'off'}"><div class="row"><div><div class="name">${x.name}</div>
    <div class="sub">${!x.reachable?'Nicht erreichbar':x.on?Math.round(x.bri/2.54)+' %':'Aus'}</div></div>
    <button class="sw" aria-label="${x.name} schalten" onclick="post('/api/hue',{id:'${x.id}',on:${!x.on}})"></button></div>
    <input type="range" min="1" max="254" value="${x.bri||1}" aria-label="Helligkeit ${x.name}" oninput="busy=Date.now()+1500" onchange="post('/api/hue',{id:'${x.id}',on:true,bri:+this.value})">
    <div class="colors">${PRESETS.map((p,i)=>`<button aria-label="${p[0]}" title="${p[0]}" style="background:${COL[i]}" onclick='post("/api/hue",{id:"${x.id}",...${JSON.stringify(p[1])}})'></button>`).join('')}</div></div>`;
function tile(x){
  const head=(sub,sw)=>`<div class="row"><div><div class="name">${x.name}</div><div class="sub">${sub}</div></div>${sw||''}</div>`;
  const sw=on=>`<button class="sw" aria-label="${x.name} schalten" onclick="cmd('${x.id}','on',${!on})"></button>`;
  if(x.type==='dimmer')return `<div class="t ${x.on?'on':''}">${head(x.on?(x.level??'–')+' %':'Aus',sw(x.on))}
    <div class="btns"><button aria-label="Dunkler" onpointerdown="hold('${x.id}','down')">Dunkler</button><button aria-label="Heller" onpointerdown="hold('${x.id}','up')">Heller</button></div></div>`;
  if(x.type==='switch')return `<div class="t ${x.on?'on':''}">${head(x.on?'An':'Aus',sw(x.on))}</div>`;
  if(x.type==='blind'||x.type==='gate'){const g=x.type==='gate',p=x.pos??0;
    return `<div class="t">${head(x.pos==null?'–':p<=2?'Offen':p>=98?'Geschlossen':Math.round(p)+' % geschlossen')}
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="btns"><button onclick="${g?`gate('${x.id}','open')`:`cmd('${x.id}','move','up')`}">Auf</button><button onclick="cmd('${x.id}','stop')">Stopp</button><button onclick="${g?`gate('${x.id}','close')`:`cmd('${x.id}','move','down')`}">Zu</button></div></div>`}
  if(x.type==='heating')return `<div class="t">${head('Ist-Temperatur')}<div class="big">${f1(x.temp)} °C</div>
    <div class="sub">Soll ${f1(x.soll)} °C · Ventil ${x.stell??'–'} %</div>
    <div class="btns"><button aria-label="Kälter" onclick="cmd('${x.id}','shift',(${x.shift??0})-0.5)">−0,5</button><button aria-label="Wärmer" onclick="cmd('${x.id}','shift',(${x.shift??0})+0.5)">+0,5</button></div></div>`;
  if(x.type==='sensor')return `<div class="t">${head(x.name)}<div class="big">${f1(x.value)} ${x.unit||''}</div></div>`;
  return '';
}
function render(d){
  last=d;$('#k').className=d.knxOk?'ok':'';$('#h').className=d.hueOk?'ok':'';$('#s').className=d.solarOk?'ok':'';
  if(busy>Date.now())return;
  const tabs=['Grundriss','Energie','Alle',...new Set(d.knx.map(x=>x.floor)),...(d.hue.length?['Hue']:[])];
  $('#tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'a':''}" onclick="tab='${t}';render(last)">${t}</button>`).join('');
  let h='';
  if(tab==='Grundriss')h=planView(d);
  if(tab==='Energie')h=energyView(d);
  if(tab!=='Hue'&&tab!=='Grundriss'&&tab!=='Energie'){
    const rooms={};d.knx.filter(x=>tab==='Alle'||x.floor===tab).forEach(x=>(rooms[x.room]??=[]).push(x));
    for(const [room,list] of Object.entries(rooms))h+=`<h2>${room}</h2><div class="grid">${list.map(tile).join('')}</div>`;
  }
  if(d.hue.length&&(tab==='Alle'||tab==='Hue'))h+=`<h2>Philips Hue</h2><div class="grid">`+d.hue.map(hueTile).join('')+'</div>';
  $('#app').innerHTML=h||'<p class="stat">Keine Geräte gefunden. Bitte config.json prüfen.</p>';
}
new EventSource('/events').onmessage=e=>render(JSON.parse(e.data));
</script></body></html>
